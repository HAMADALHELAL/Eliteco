<div class="course-page" *ngIf="!loading; else loadingTpl">
  <div class="course-wrapper" *ngIf="course">
    <h2>{{ course.title }}</h2>
    <p>{{ course.description }}</p>
    <p><strong>Price:</strong> {{ course.price | currency: 'KWD' }}</p>

    <!-- 👥 Subscribers count -->
    <p class="sub-count" *ngIf="course.subscribersCount !== undefined">
      👥 <strong>{{ course.subscribersCount }}</strong> people subscribed
    </p>

    <!-- 🎬 If subscribed: show videos -->
    <div *ngIf="isSubscribed; else subscribeTpl">
      <h3>🎬 Course Videos</h3>

      <!-- ✅ Timeline navigation -->
      <div *ngIf="videos.length; else noVideos">
        <div class="timeline">
          <div
            *ngFor="let v of videos; let i = index"
            class="timeline-item"
            [class.active]="i === selectedVideoIndex"
            (click)="selectVideo(i)"
          >
            {{ i + 1 }}
          </div>
        </div>

        <!-- 🎥 Selected video -->
        <div class="video-player">
          <video
            *ngIf="videos[selectedVideoIndex]"
            [src]="videos[selectedVideoIndex].url"
            controls
            class="course-video"
          ></video>
        </div>
      </div>

      <ng-template #noVideos>
        <p>No videos available for this course.</p>
      </ng-template>
    </div>
  </div>
</div>

<ng-template #subscribeTpl>
  <button class="subscribe-btn" (click)="subscribe(course?._id!)">
    💳 Subscribe to Watch
  </button>
</ng-template>

<ng-template #loadingTpl>
  <p>Loading course...</p>
</ng-template>
