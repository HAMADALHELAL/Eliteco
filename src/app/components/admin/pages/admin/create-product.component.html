<div class="create-wrapper">
    <h2>إضافة منتج جديد</h2>
  
    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <label>عنوان المنتج</label>
        <input type="text" [(ngModel)]="title" name="title" required />
      </div>
  
      <div class="form-row">
        <label>الوصف</label>
        <textarea
          rows="3"
          [(ngModel)]="description"
          name="description"
        ></textarea>
      </div>
  
      <div class="form-row inline">
        <div>
          <label>السعر</label>
          <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="price"
            name="price"
            required
          />
        </div>
  
        <div>
          <label>الكمية</label>
          <input
            type="number"
            min="0"
            [(ngModel)]="quantity"
            name="quantity"
          />
        </div>
      </div>
  
      <div class="form-row">
        <label>الصور (اختياري)</label>
        <input type="file" (change)="onFilesSelected($event)" multiple />
        <small *ngIf="files.length">Selected: {{ files.length }} file(s)</small>
      </div>
  
      <div *ngIf="error" class="error">
        {{ error }}
      </div>
  
      <div class="actions">
        <button
          type="button"
          class="secondary"
          (click)="cancel()"
          [disabled]="loading"
        >
          إلغاء
        </button>
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
